name: 📱 Build Android APK

run-name: 📱 Bootchat ${{ inputs.build_mode || 'release' }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: 🔨 arm64-v8a APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build APK (arm64-v8a only)
        run: flutter build apk --${{ inputs.build_mode || 'release' }} --target-platform android-arm64

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bootchat-${{ inputs.build_mode || 'release' }}-${{ github.run_number }}
          path: flutter_app/build/app/outputs/flutter-apk/app-${{ inputs.build_mode || 'release' }}.apk
          retention-days: 14

      - name: 📊 Build summary
        if: always()
        run: |
          MODE="${{ inputs.build_mode || 'release' }}"
          APK="build/app/outputs/flutter-apk/app-$MODE.apk"
          {
            echo "## 📱 Bootchat APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 🏗️ Mode | \`$MODE\` |"
            echo "| 📐 ABI | \`arm64-v8a\` — 64-bit phones only |"
            if [ -f "$APK" ]; then
              echo "| 💾 Size | **$(du -h "$APK" | cut -f1)** |"
            else
              echo "| 💾 Size | ❌ build failed |"
            fi
            echo "| 🔖 Commit | \`${GITHUB_SHA::7}\` |"
            echo "| 🔢 Run | #${{ github.run_number }} |"
            echo ""
            echo "⬇️ Grab it from the **Artifacts** section at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"
