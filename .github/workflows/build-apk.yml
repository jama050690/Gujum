name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --${{ github.event.inputs.build_mode || 'release' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bootchat-apk-${{ github.event.inputs.build_mode || 'release' }}
          path: flutter_app/build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_mode || 'release' }}.apk
          retention-days: 14
