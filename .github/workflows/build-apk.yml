name: 📱 Build Gujum APK

run-name: 📱 Gujum ${{ inputs.build_mode || 'release' }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version_bump:
        description: 'Version bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: 🔨 arm64-v8a APK
    runs-on: ubuntu-latest
    # Healthy builds run 12-15 min (slowest observed: 15m14s); the run that lost
    # its runner was at 21m30s. 20 min clears the former and trips on the latter,
    # instead of letting the 6-hour default burn hours on a hung Gradle.
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Every run was rebuilding from scratch (~14 min of Gradle). Keyed on the
      # build scripts and the resolved lockfile so it invalidates when the
      # dependency set actually changes, not on every commit.
      - name: 🐘 Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter_app/android/**/*.gradle*', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔖 Bump version
        id: meta
        run: |
          set -euo pipefail
          MODE="${{ inputs.build_mode || 'release' }}"
          # Auto (push) runs never bump — only manual dispatch does.
          BUMP="${{ inputs.version_bump || 'none' }}"

          CURRENT=$(grep -m1 '^version:' pubspec.yaml | cut -d: -f2 | tr -d '[:space:]')
          [ -n "$CURRENT" ] || { echo "::error::no version in pubspec.yaml"; exit 1; }
          SEMVER="${CURRENT%%+*}"
          BUILD="${CURRENT##*+}"
          [ "$BUILD" != "$CURRENT" ] || BUILD=0
          IFS=. read -r MA MI PA <<< "$SEMVER"

          case "$BUMP" in
            major) MA=$((MA + 1)); MI=0; PA=0 ;;
            minor) MI=$((MI + 1)); PA=0 ;;
            patch) PA=$((PA + 1)) ;;
            none)  ;;
          esac
          NEW_SEMVER="$MA.$MI.$PA"
          # versionCode must always climb or Android refuses the upgrade. Push
          # runs don't commit back, so deriving it from the (monotonic) run
          # number keeps it unique without needing the file to persist.
          # run_number alone is not enough: it does NOT advance on a re-run
          # (only run_attempt does), so re-running a build used to emit a
          # duplicate versionCode that Play rejects. Folding in the attempt
          # keeps it strictly increasing: run 13 attempt 1 -> 1301, run 14 -> 1401.
          NEW_BUILD=$(( ${{ github.run_number }} * 100 + ${{ github.run_attempt }} ))

          sed -i "s/^version:.*/version: $NEW_SEMVER+$NEW_BUILD/" pubspec.yaml

          # Build number in the name too, or every push overwrites the same artifact.
          NAME="GujumChat-$NEW_SEMVER+$NEW_BUILD"
          [ "$MODE" = "release" ] || NAME="$NAME-$MODE"

          {
            echo "mode=$MODE"
            echo "bump=$BUMP"
            echo "version=$NEW_SEMVER"
            echo "build=$NEW_BUILD"
            echo "apk_name=$NAME"
          } >> "$GITHUB_OUTPUT"
          echo "📦 $CURRENT → $NEW_SEMVER+$NEW_BUILD ($BUMP) → $NAME.apk"

      - name: 🔐 Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail loudly: a debug-signed release APK builds fine but Google
          # Sign-In rejects it, and that is painful to diagnose after the fact.
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret yo'q"; exit 1; }

          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          keytool -list -v -keystore android/app/release.jks \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E 'SHA1:|SHA256:' || true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build APK (arm64-v8a only)
        run: flutter build apk --${{ steps.meta.outputs.mode }} --target-platform android-arm64

      - name: 🏷️ Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv "app-${{ steps.meta.outputs.mode }}.apk" "${{ steps.meta.outputs.apk_name }}.apk"

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: flutter_app/build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}.apk
          retention-days: 14

      - name: 💾 Commit version bump
        if: success() && steps.meta.outputs.bump != 'none'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          # [skip ci] stops this push from re-triggering the workflow.
          git commit -m "chore: bump version to ${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: 📊 Build summary
        if: always()
        run: |
          APK="build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}.apk"
          {
            echo "## 📱 Gujum APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 📄 File | \`${{ steps.meta.outputs.apk_name }}.apk\` |"
            echo "| 🔖 Version | \`${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build }}\` |"
            echo "| ⬆️ Bump | \`${{ steps.meta.outputs.bump }}\` |"
            echo "| 🏗️ Mode | \`${{ steps.meta.outputs.mode }}\` |"
            echo "| 📐 ABI | \`arm64-v8a\` — 64-bit phones only |"
            if [ -f "$APK" ]; then
              echo "| 💾 Size | **$(du -h "$APK" | cut -f1)** |"
            else
              echo "| 💾 Size | ❌ build failed |"
            fi
            echo "| 🔢 Commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "⬇️ Grab it from the **Artifacts** section at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"
