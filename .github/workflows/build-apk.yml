name: 📱 Build Android APK

run-name: 📱 Bootchat ${{ inputs.build_mode || 'release' }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: 🔨 arm64-v8a APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🏷️ Resolve version
        id: meta
        run: |
          MODE="${{ inputs.build_mode || 'release' }}"
          VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d: -f2 | cut -d+ -f1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from pubspec.yaml"
            exit 1
          fi
          NAME="bootchat-$VERSION"
          [ "$MODE" = "release" ] || NAME="$NAME-$MODE"
          echo "mode=$MODE"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME"    >> "$GITHUB_OUTPUT"
          echo "📦 building $NAME.apk (v$VERSION, $MODE)"

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Build APK (arm64-v8a only)
        run: flutter build apk --${{ steps.meta.outputs.mode }} --target-platform android-arm64

      - name: 🏷️ Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          mv "app-${{ steps.meta.outputs.mode }}.apk" "${{ steps.meta.outputs.apk_name }}.apk"

      - name: ⬆️ Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: flutter_app/build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}.apk
          retention-days: 14

      - name: 📊 Build summary
        if: always()
        run: |
          APK="build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}.apk"
          {
            echo "## 📱 Bootchat APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 📄 File | \`${{ steps.meta.outputs.apk_name }}.apk\` |"
            echo "| 🔖 Version | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 🏗️ Mode | \`${{ steps.meta.outputs.mode }}\` |"
            echo "| 📐 ABI | \`arm64-v8a\` — 64-bit phones only |"
            if [ -f "$APK" ]; then
              echo "| 💾 Size | **$(du -h "$APK" | cut -f1)** |"
            else
              echo "| 💾 Size | ❌ build failed |"
            fi
            echo "| 🔢 Commit | \`${GITHUB_SHA::7}\` |"
            echo ""
            echo "⬇️ Grab it from the **Artifacts** section at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"
