name: gujum_chat
description: Gujum — Flutter client.
publish_to: "none"

version: 1.0.0+4101

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Arabcha uchun o'ngdan chapga yo'nalish va tizim matnlari (dialog
  # tugmalari, sana tanlagich) shu paketdan keladi.
  flutter_localizations:
    sdk: flutter
  audioplayers: any
  cached_network_image: ^3.4.1
  cupertino_icons: any
  file_picker: any
  flutter_contacts: ^1.1.9+2
  flutter_webrtc: ^1.3.0
  google_sign_in: 6.2.2
  geolocator: any
  http: any
  image_picker: any
  permission_handler: ^11.3.1
  provider: any
  record: ^6.2.0
  shared_preferences: any
  socket_io_client: any
  url_launcher: any
  video_player: ^2.9.2
  path_provider: any
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.0
  flutter_callkit_incoming: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/gujum_logo.png
    - assets/sounds/dialing.wav
    - assets/sounds/message.mp3
    - assets/sounds/ringtone.wav