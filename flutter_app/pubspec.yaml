name: bootchat_flutter
description: Flutter client for the Bootchat backend.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: any
  cupertino_icons: any
  file_picker: any
  flutter_webrtc: ^1.3.0
  google_sign_in: 6.2.2
  geolocator: any
  http: any
  image_picker: any
  permission_handler: ^11.3.1
  provider: any
  record: ^6.2.0
  shared_preferences: any
  socket_io_client: any
  url_launcher: any
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/bootchat_logo.png
