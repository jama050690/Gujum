# Sized for the 2-core / 7 GB ubuntu-latest runner this builds on. The old
# -Xmx8G -XX:MaxMetaspaceSize=4G over-committed that box: R8 in the Gradle
# daemon plus a separate Kotlin daemon pushed it into swap, which is why the
# same build swung from 828s to 1289s and then lost the runner entirely.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
